[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["downloads/*"]

[functions."serve-file"]
  external_node_modules = ["fs", "path", "crypto"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
